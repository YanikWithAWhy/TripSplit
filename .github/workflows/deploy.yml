# Builds the app and publishes it on GitHub Pages on every push to main.
# One-time setup on GitHub (see README → "Veröffentlichen mit GitHub Pages"):
#   Settings → Pages → Source: "GitHub Actions"
#   Settings → Secrets and variables → Actions → Variables: VITE_SUPABASE_URL, VITE_SUPABASE_KEY
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push doesn't cancel a running one halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Fail if Supabase is not configured
        if: ${{ vars.VITE_SUPABASE_URL == '' || vars.VITE_SUPABASE_KEY == '' }}
        run: |
          echo "::error::Set the repository variables VITE_SUPABASE_URL and VITE_SUPABASE_KEY (Settings → Secrets and variables → Actions → Variables)."
          exit 1

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Check types and lint
        run: |
          npm run typecheck
          npm run lint

      - run: npm test

      - name: Build
        run: npm run build
        env:
          # Public values (the publishable key is meant for browsers; row level security protects the data).
          # Stored as repository variables, not secrets, because they end up in the built files anyway.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_KEY: ${{ vars.VITE_SUPABASE_KEY }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
